# This is a basic workflow to help you get started with Actions
name: Build documentation

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    permissions:
      contents: write

    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      - name: Setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
            python-version: '3.12'
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo
      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install python3-sphinx pandoc doxygen
          python -m pip install --upgrade pip
          python -m pip install sphinx_rtd_theme unidecode nbsphinx wheel breathe exhale
      - name: Build and commit
        uses: sphinx-notes/pages@54521400a4021e1c33be0966ae543ce8c8dd1a13 # v2 branch
        with:
          documentation_path: './docs'
      - name: Push documentation
        uses: ad-m/github-push-action@7fba72704ad2db819788db8f2d9e7d1dfbebe089 # master as of 2026-11-06
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
